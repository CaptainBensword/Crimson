name: Render Storm Frontier audio

on:
  push:
    branches: [main]
    paths:
      - "music/midi/storm-frontier-horn.mid"
      - ".github/workflows/render-storm-frontier-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Crimson
        uses: actions/checkout@v4

      - name: Install audio renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth fluid-soundfont-gm ffmpeg

      - name: Render French horn MIDI
        run: |
          set -euo pipefail
          SOUNDFONT="$(dpkg -L fluid-soundfont-gm | grep -E '\.sf2$' | head -n 1)"
          if [ -z "$SOUNDFONT" ] || [ ! -f "$SOUNDFONT" ]; then
            echo "Could not locate the installed General MIDI SoundFont"
            exit 1
          fi
          mkdir -p music/audio
          fluidsynth -ni -g 0.75 -r 44100 "$SOUNDFONT" music/midi/storm-frontier-horn.mid -F /tmp/storm-frontier-horn.wav
          ffmpeg -y -i /tmp/storm-frontier-horn.wav -i music/covers/storm-frontier-cover.svg \
            -map 0:a -map 1:v -c:a libmp3lame -b:a 160k -ac 2 \
            -c:v mjpeg -disposition:v:0 attached_pic \
            -metadata title="Storm Frontier" \
            -metadata artist="Talon" \
            -metadata album="Crimson" \
            -metadata:s:v title="Cover" \
            -metadata:s:v comment="Cover (front)" \
            -id3v2_version 3 music/audio/storm-frontier-horn.mp3

      - name: Commit listening audio
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/audio/storm-frontier-horn.mp3
          if git diff --cached --quiet; then
            echo "Audio file is already up to date"
            exit 0
          fi
          git commit -m "Add Storm Frontier listening audio"
          git push
